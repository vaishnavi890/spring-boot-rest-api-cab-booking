<!DOCTYPE html>
<html>
<head>
  <title>Make a Payment</title>
</head>
<body>
<h2>Payment Form</h2>
<form action="/api/payments" method="post">
  <label>Ride ID:</label><input type="number" name="rideId" required><br>
  <label>User ID:</label><input type="number" name="userId" required><br>
  <label>Amount:</label><input type="number" step="0.01" name="amount" required><br>
  <label>Payment Method:</label><input type="text" name="paymentMethod" required><br>
  <label>Status:</label><input type="text" name="status" value="Success"><br>
  <button type="submit">Submit Payment</button>
</form>
</body>
</html>
