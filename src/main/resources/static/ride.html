<!DOCTYPE html>
<html>
<head>
    <title>Book a Ride</title>
</head>
<body>
<h2>Ride Booking Form</h2>
<form action="/api/rides" method="post">
    <label>User ID:</label><input type="number" name="userId" required><br>
    <label>Driver ID:</label><input type="number" name="driverId" required><br>
    <label>Pickup Location:</label><input type="text" name="pickupLocation" required><br>
    <label>Dropoff Location:</label><input type="text" name="dropoffLocation" required><br>
    <label>Fare:</label><input type="number" step="0.01" name="fare" required><br>
    <label>Status:</label><input type="text" name="status" value="Pending"><br>
    <button type="submit">Book Ride</button>
</form>
</body>
</html>
